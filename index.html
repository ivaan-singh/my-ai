<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Your AI</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
  :root {
    --bg: #080808;
    --surface: #111;
    --card: #181818;
    --border: #242424;
    --green: #b8f04a;
    --green-glow: rgba(184,240,74,0.15);
    --green-dim: #3a5210;
    --white: #efefef;
    --muted: #555;
    --user-bubble: #1a2c06;
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    background: var(--bg);
    color: var(--white);
    font-family: 'DM Sans', sans-serif;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  header {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    flex-shrink: 0;
  }

  .av-wrap { position: relative; width: 42px; height: 42px; flex-shrink: 0; }

  .av-ring {
    position: absolute; inset: -3px; border-radius: 50%;
    border: 2px solid var(--green);
    animation: spin-ring 4s linear infinite;
    border-right-color: transparent; border-bottom-color: transparent;
  }
  @keyframes spin-ring { to { transform: rotate(360deg); } }

  .avatar {
    width: 42px; height: 42px; border-radius: 50%;
    background: linear-gradient(135deg, #1e3a00, #3a6e00);
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
  }

  .hinfo h1 { font-family: 'Syne', sans-serif; font-size: 15px; font-weight: 800; }

  .hinfo .status {
    font-size: 11px; color: var(--green);
    display: flex; align-items: center; gap: 5px;
  }

  .status-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--green); animation: blink 2s ease infinite;
  }
  @keyframes blink { 0%,100%{opacity:1;} 50%{opacity:0.3;} }

  .mood-tag {
    margin-left: auto;
    font-family: 'Syne', sans-serif; font-size: 10px; font-weight: 700;
    letter-spacing: 1.5px; text-transform: uppercase; color: var(--green);
    border: 1px solid var(--green-dim); background: rgba(184,240,74,0.06);
    padding: 4px 10px; border-radius: 6px;
  }

  #messages {
    flex: 1; overflow-y: auto;
    padding: 24px 16px 16px;
    display: flex; flex-direction: column; gap: 14px;
    scroll-behavior: smooth;
  }
  #messages::-webkit-scrollbar { width: 3px; }
  #messages::-webkit-scrollbar-thumb { background: #2a2a2a; border-radius: 3px; }

  .msg {
    display: flex; gap: 9px; max-width: 82%;
    animation: pop 0.25s cubic-bezier(0.34,1.56,0.64,1) both;
  }
  @keyframes pop {
    from { opacity:0; transform: scale(0.9) translateY(8px); }
    to   { opacity:1; transform: scale(1) translateY(0); }
  }

  .msg.user { align-self: flex-end; flex-direction: row-reverse; }
  .msg.ai   { align-self: flex-start; }

  .msg-av {
    width: 26px; height: 26px; border-radius: 50%;
    flex-shrink: 0; display: flex; align-items: center;
    justify-content: center; font-size: 12px; margin-top: 3px;
  }
  .msg.ai   .msg-av { background: linear-gradient(135deg,#1e3a00,#3a6e00); }
  .msg.user .msg-av { background: #222; }

  .bubble {
    padding: 10px 14px; border-radius: 18px;
    font-size: 14px; line-height: 1.6;
  }
  .msg.ai .bubble {
    background: var(--card); border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
  }
  .msg.user .bubble {
    background: var(--user-bubble); border: 1px solid var(--green-dim);
    border-bottom-right-radius: 4px;
  }

  /* markdown */
  .bubble p { margin: 0 0 8px; }
  .bubble p:last-child { margin-bottom: 0; }
  .bubble strong { font-weight: 700; color: var(--white); }
  .bubble em { font-style: italic; color: #ccc; }
  .bubble h2 {
    font-family: 'Syne', sans-serif; font-size: 14px; font-weight: 800;
    color: var(--green); margin: 12px 0 6px; padding-bottom: 4px;
    border-bottom: 1px solid var(--green-dim);
  }
  .bubble h3 { font-size: 13px; font-weight: 700; color: var(--green); margin: 10px 0 4px; }
  .bubble ul, .bubble ol { padding-left: 18px; margin: 6px 0; }
  .bubble li { margin: 4px 0; }
  .bubble code {
    background: #0d0d0d; border: 1px solid var(--border);
    padding: 1px 6px; border-radius: 4px;
    font-family: monospace; font-size: 12px; color: var(--green);
  }
  .bubble pre {
    background: #0d0d0d; border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 12px; margin: 8px 0; overflow-x: auto;
  }
  .bubble pre code { background: none; border: none; padding: 0; color: #ccc; }
  .bubble hr { border: none; border-top: 1px solid var(--border); margin: 10px 0; }
  .bubble a { color: var(--green); text-decoration: none; }
  .bubble a:hover { text-decoration: underline; }

  /* cursor */
  .cursor {
    display: inline-block; width: 2px; height: 14px;
    background: var(--green); margin-left: 2px;
    vertical-align: middle; border-radius: 1px;
    animation: cur 0.6s step-end infinite;
  }
  @keyframes cur { 0%,100%{opacity:1;} 50%{opacity:0;} }

  /* thinking bar */
  #thinking-bar {
    display: none; align-items: center; gap: 10px;
    padding: 8px 18px; font-size: 12px; color: var(--muted);
    flex-shrink: 0; border-top: 1px solid var(--border);
    background: var(--surface);
  }
  #thinking-bar.show { display: flex; }

  .think-dots { display: flex; gap: 4px; }
  .think-dots span {
    width: 5px; height: 5px; border-radius: 50%;
    background: var(--green); animation: td 1s ease infinite;
  }
  .think-dots span:nth-child(2) { animation-delay:.15s; }
  .think-dots span:nth-child(3) { animation-delay:.3s; }
  @keyframes td { 0%,80%,100%{transform:scale(0.6);opacity:0.4;} 40%{transform:scale(1);opacity:1;} }

  .search-pill {
    display: inline-flex; align-items: center; gap: 5px;
    background: rgba(184,240,74,0.08); border: 1px solid var(--green-dim);
    color: var(--green); font-size: 11px; padding: 3px 9px;
    border-radius: 20px; font-style: normal; font-weight: 500;
  }
  .search-pill svg { animation: spin-ring 1s linear infinite; flex-shrink: 0; }

  /* chips */
  .chips {
    display: flex; gap: 7px; flex-wrap: wrap;
    padding: 0 16px 10px; flex-shrink: 0;
  }
  .chip {
    background: var(--card); border: 1px solid var(--border);
    color: #ccc; font-size: 12px; padding: 6px 13px;
    border-radius: 20px; cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    transition: all 0.18s; white-space: nowrap;
  }
  .chip:hover {
    border-color: var(--green); color: var(--green);
    background: var(--green-glow); transform: translateY(-1px);
  }

  /* input */
  .input-area {
    padding: 10px 14px 14px;
    border-top: 1px solid var(--border);
    background: var(--surface); flex-shrink: 0;
  }
  .input-row {
    display: flex; gap: 8px; align-items: flex-end;
    background: var(--card); border: 1px solid var(--border);
    border-radius: 26px; padding: 7px 7px 7px 16px;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .input-row:focus-within {
    border-color: var(--green);
    box-shadow: 0 0 0 3px rgba(184,240,74,0.08);
  }
  #input {
    flex: 1; background: transparent; border: none; outline: none;
    color: var(--white); font-family: 'DM Sans', sans-serif;
    font-size: 14px; resize: none; max-height: 90px;
    line-height: 1.5; padding: 3px 0;
  }
  #input::placeholder { color: var(--muted); }

  #sendBtn {
    width: 34px; height: 34px; border-radius: 50%;
    background: var(--green); border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; transition: transform 0.15s, box-shadow 0.15s;
  }
  #sendBtn:hover { transform: scale(1.1); box-shadow: 0 0 12px rgba(184,240,74,0.4); }
  #sendBtn:active { transform: scale(0.93); }
  #sendBtn:disabled { background: var(--border); cursor: not-allowed; box-shadow: none; transform: none; }

  /* welcome */
  .welcome {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 6px; height: 100%; text-align: center; padding: 20px;
    pointer-events: none;
  }
  .welcome-ball {
    font-size: 54px; line-height: 1; margin-bottom: 10px;
    filter: drop-shadow(0 0 20px rgba(184,240,74,0.3));
    animation: float 3s ease-in-out infinite;
  }
  @keyframes float { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-8px);} }
  .welcome h2 {
    font-family: 'Syne', sans-serif; font-size: 24px; font-weight: 800;
    background: linear-gradient(135deg, var(--white), var(--green));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  }
  .welcome p { font-size: 13px; color: var(--muted); }
</style>
</head>
<body>

<header>
  <div class="av-wrap">
    <div class="av-ring"></div>
    <div class="avatar">&#x26BD;</div>
  </div>
  <div class="hinfo">
    <h1>Your AI</h1>
    <div class="status"><div class="status-dot"></div> online</div>
  </div>
  <div class="mood-tag">Chill &#x2726;</div>
</header>

<div id="messages">
  <div class="welcome" id="welcome">
    <div class="welcome-ball">&#x26BD;</div>
    <h2>What's good?</h2>
    <p>Talk footy, life, whatever.</p>
  </div>
</div>

<div id="thinking-bar">
  <div class="think-dots"><span></span><span></span><span></span></div>
  <div id="think-text" style="font-style:italic">thinking...</div>
</div>

<div class="chips" id="chips">
  <button class="chip" onclick="quickSend(this)">&#x1F3C6; Prem title race?</button>
  <button class="chip" onclick="quickSend(this)">&#x1F410; Messi or Ronaldo?</button>
  <button class="chip" onclick="quickSend(this)">&#x26A1; Best goal ever?</button>
  <button class="chip" onclick="quickSend(this)">Just vibe</button>
</div>

<div class="input-area">
  <div class="input-row">
    <textarea id="input" rows="1" placeholder="say something..."></textarea>
    <button id="sendBtn" onclick="sendMessage()">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
      </svg>
    </button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
<script>
var messagesEl  = document.getElementById('messages');
var inputEl     = document.getElementById('input');
var sendBtn     = document.getElementById('sendBtn');
var welcomeEl   = document.getElementById('welcome');
var chipsEl     = document.getElementById('chips');
var thinkingBar = document.getElementById('thinking-bar');
var thinkText   = document.getElementById('think-text');

var history    = [];
var isThinking = false;

var thinkPhrases = ['thinking...','on it...','give me a sec...','cooking...','lemme think...','searching...','looking it up...'];

var SYSTEM_PROMPT = 'You are a chill, laid-back AI homie who loves football (soccer). You have access to web search.\n\nPersonality:\n- Casual always, like texting a mate. Never formal.\n- Real opinions, no fence-sitting. Be direct.\n- Funny but effortless, never try-hard.\n- Use footy slang naturally (worldie, tekkers, top bins, banger, park the bus, etc.)\n- Football is your zone but chat about anything.\n- Never say you are an AI unless asked directly.\n\nResponse length:\n- Simple chit-chat: a few sentences is fine.\n- Football analysis, player comparisons, match details, news: give a FULL thorough answer. Cover all the key points. Do NOT cut yourself short.\n- Never truncate an answer just to keep it brief.\n\nFormatting — always use markdown:\n- **bold** for player names, clubs, key facts\n- *italic* for opinions or emphasis\n- Bullet points for lists\n- ## headers to break up longer answers\n- For match recaps:\n  ## Team A vs Team B\n  **Score:** X-X | Competition | Date\n  Key moments as bullets\n\nAlways search the web for: live scores, results, transfers, standings, injuries, anything needing current info.\nToday is ' + new Date().toDateString() + '.';

inputEl.addEventListener('input', function() {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 90) + 'px';
});

inputEl.addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});

function quickSend(el) {
  var label = el.textContent.trim();
  var map = {};
  map['\u{1F3C6} Prem title race?'] = "Who's winning the Premier League this season? Give me the full picture.";
  map['\u{1F410} Messi or Ronaldo?'] = "Messi or Ronaldo — settle it, who's the GOAT and why?";
  map['\u26A1 Best goal ever?'] = "What's the best goal ever scored in football history?";
  map['Just vibe'] = "just vibing, what's up?";
  inputEl.value = map[label] || label;
  sendMessage();
  chipsEl.style.display = 'none';
}

function renderMD(text) {
  if (typeof marked !== 'undefined') return marked.parse(text, { breaks: true, gfm: true });
  return text;
}

function addMessage(role, text) {
  welcomeEl.style.display = 'none';
  var div = document.createElement('div');
  div.className = 'msg ' + role;
  var av = document.createElement('div');
  av.className = 'msg-av';
  av.textContent = role === 'ai' ? '\u26BD' : '\uD83D\uDE0E';
  var bubble = document.createElement('div');
  bubble.className = 'bubble';
  if (role === 'ai') bubble.innerHTML = renderMD(text);
  else bubble.textContent = text;
  div.appendChild(av);
  div.appendChild(bubble);
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function typeMessage(text) {
  welcomeEl.style.display = 'none';
  var div = document.createElement('div');
  div.className = 'msg ai';
  var av = document.createElement('div');
  av.className = 'msg-av'; av.textContent = '\u26BD';
  var bubble = document.createElement('div');
  bubble.className = 'bubble';
  var cursor = document.createElement('span');
  cursor.className = 'cursor';
  bubble.appendChild(cursor);
  div.appendChild(av);
  div.appendChild(bubble);
  messagesEl.appendChild(div);

  var i = 0;
  var speed = Math.max(10, Math.min(28, 1600 / text.length));

  return new Promise(function(resolve) {
    function type() {
      if (i < text.length) {
        bubble.insertBefore(document.createTextNode(text[i]), cursor);
        i++;
        messagesEl.scrollTop = messagesEl.scrollHeight;
        setTimeout(type, speed);
      } else {
        cursor.remove();
        bubble.innerHTML = renderMD(text);
        messagesEl.scrollTop = messagesEl.scrollHeight;
        resolve();
      }
    }
    type();
  });
}

function setThinking(label, searching) {
  if (searching) {
    thinkText.innerHTML = '<span class="search-pill"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>' + label + '</span>';
  } else {
    thinkText.innerHTML = '<span style="font-style:italic">' + label + '</span>';
  }
}

async function sendMessage() {
  var text = inputEl.value.trim();
  if (!text || isThinking) return;

  inputEl.value = '';
  inputEl.style.height = 'auto';
  isThinking = true;
  sendBtn.disabled = true;
  chipsEl.style.display = 'none';

  addMessage('user', text);
  history.push({ role: 'user', content: text });

  setThinking(thinkPhrases[Math.floor(Math.random() * 5)]);
  thinkingBar.classList.add('show');

  try {
    var msgs = history.slice();
    var finalReply = null;

    while (!finalReply) {
      var res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          model: 'claude-sonnet-4-20250514',
          max_tokens: 2000,
          system: SYSTEM_PROMPT,
          tools: [{ type: 'web_search_20250305', name: 'web_search' }],
          messages: msgs
        })
      });

      var data = await res.json();

      if (data.stop_reason === 'tool_use') {
        var toolUse = null;
        for (var i = 0; i < data.content.length; i++) {
          if (data.content[i].type === 'tool_use') { toolUse = data.content[i]; break; }
        }
        if (toolUse) {
          var q = toolUse.input && toolUse.input.query ? toolUse.input.query.slice(0,40) : '...';
          setThinking('searching "' + q + '"', true);
        }
        msgs.push({ role: 'assistant', content: data.content });
        var serverResults = data.content.filter(function(b) { return b.type === 'tool_result'; });
        if (serverResults.length) {
          msgs.push({ role: 'user', content: serverResults });
        } else {
          msgs.push({ role: 'user', content: data.content.filter(function(b) { return b.type === 'tool_use'; }).map(function(b) { return { type: 'tool_result', tool_use_id: b.id, content: 'Search completed.' }; }) });
        }
        setThinking('cooking...');
      } else {
        var textBlock = null;
        if (data.content) {
          for (var k = 0; k < data.content.length; k++) {
            if (data.content[k].type === 'text') { textBlock = data.content[k]; break; }
          }
        }
        finalReply = textBlock ? textBlock.text : (data.error ? 'Error: ' + data.error.message : 'yo brain glitched');
      }
    }

    thinkingBar.classList.remove('show');
    history.push({ role: 'assistant', content: finalReply });
    await typeMessage(finalReply);

  } catch(err) {
    console.error(err);
    thinkingBar.classList.remove('show');
    await typeMessage('lost connection for a sec, try again?');
    history.pop();
  }

  isThinking = false;
  sendBtn.disabled = false;
  inputEl.focus();
}
</script>
</body>
</html>
