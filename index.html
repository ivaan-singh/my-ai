<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Your AI</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,400&display=swap" rel="stylesheet"/>
<style>
:root {
  --bg: #080808; --surface: #101010; --sidebar: #0d0d0d;
  --card: #181818; --border: #1f1f1f; --border2: #2a2a2a;
  --green: #b8f04a; --green-glow: rgba(184,240,74,0.12);
  --green-dim: #2e420d; --white: #efefef;
  --muted: #4a4a4a; --muted2: #666; --user-bubble: #182608;
  --sidebar-w: 260px;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--bg); color:var(--white); font-family:'DM Sans',sans-serif; height:100dvh; display:flex; overflow:hidden; }

/* SIDEBAR */
#sidebar { width:var(--sidebar-w); background:var(--sidebar); border-right:1px solid var(--border); display:flex; flex-direction:column; flex-shrink:0; transition:transform 0.3s cubic-bezier(0.4,0,0.2,1); z-index:10; }
.sb-top { padding:16px 14px 12px; border-bottom:1px solid var(--border); display:flex; flex-direction:column; gap:10px; }
.sb-logo { display:flex; align-items:center; gap:9px; padding:2px 0; }
.sb-logo-ball { width:30px; height:30px; background:linear-gradient(135deg,#1e3a00,#3a6e00); border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:15px; flex-shrink:0; }
.sb-logo span { font-family:'Syne',sans-serif; font-size:14px; font-weight:800; letter-spacing:-0.2px; }
#newChatBtn { display:flex; align-items:center; gap:8px; background:var(--green); color:#000; border:none; border-radius:10px; padding:9px 14px; font-family:'DM Sans',sans-serif; font-size:13px; font-weight:600; cursor:pointer; transition:all 0.18s; width:100%; }
#newChatBtn:hover { background:#caf56a; transform:translateY(-1px); }
.sb-search { position:relative; padding:10px 14px; border-bottom:1px solid var(--border); }
.sb-search input { width:100%; background:var(--card); border:1px solid var(--border2); border-radius:8px; padding:8px 10px 8px 32px; color:var(--white); font-family:'DM Sans',sans-serif; font-size:12px; outline:none; transition:border-color 0.2s; }
.sb-search input:focus { border-color:var(--green); }
.sb-search input::placeholder { color:var(--muted2); }
.sb-search-icon { position:absolute; left:23px; top:50%; transform:translateY(-50%); color:var(--muted2); pointer-events:none; }
.sb-chats { flex:1; overflow-y:auto; padding:8px; }
.sb-chats::-webkit-scrollbar { width:3px; }
.sb-chats::-webkit-scrollbar-thumb { background:var(--border2); border-radius:3px; }
.sb-section-label { font-size:10px; font-weight:600; letter-spacing:1px; text-transform:uppercase; color:var(--muted2); padding:8px 8px 4px; }
.chat-item { display:flex; align-items:center; gap:8px; padding:8px 10px; border-radius:8px; cursor:pointer; transition:background 0.15s; position:relative; border:1px solid transparent; }
.chat-item:hover { background:var(--card); }
.chat-item.active { background:var(--green-glow); border-color:var(--green-dim); }
.chat-item-icon { width:26px; height:26px; border-radius:6px; background:var(--card); display:flex; align-items:center; justify-content:center; font-size:12px; flex-shrink:0; border:1px solid var(--border2); }
.chat-item.active .chat-item-icon { background:var(--green-dim); border-color:var(--green-dim); }
.chat-item-info { flex:1; min-width:0; }
.chat-item-title { font-size:12px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:var(--white); }
.chat-item.active .chat-item-title { color:var(--green); }
.chat-item-time { font-size:10px; color:var(--muted2); margin-top:1px; }
.chat-item-del { opacity:0; background:none; border:none; color:var(--muted2); cursor:pointer; padding:2px; border-radius:4px; transition:opacity 0.15s,color 0.15s; flex-shrink:0; }
.chat-item:hover .chat-item-del { opacity:1; }
.chat-item-del:hover { color:#ff5555; }
.no-chats { padding:20px 10px; text-align:center; font-size:12px; color:var(--muted2); font-style:italic; }
.sb-bottom { border-top:1px solid var(--border); padding:12px 10px; }
.account-info { display:flex; align-items:center; gap:10px; padding:8px; border-radius:10px; background:var(--card); border:1px solid var(--border2); margin-bottom:8px; }
.account-av { width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:14px; flex-shrink:0; font-weight:700; }
.account-av.guest { background:var(--border2); font-size:16px; }
.account-av.google { background:#fff; color:#000; font-size:11px; font-weight:700; }
.account-av.microsoft { background:#00a4ef; color:#fff; font-size:11px; font-weight:700; }
.account-text { flex:1; min-width:0; }
.account-name { font-size:12px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.account-sub { font-size:10px; color:var(--muted2); }
.sign-in-btns { display:flex; flex-direction:column; gap:6px; }
.sign-in-btn { display:flex; align-items:center; gap:9px; width:100%; padding:8px 12px; border-radius:8px; border:1px solid var(--border2); background:var(--card); color:var(--white); font-family:'DM Sans',sans-serif; font-size:12px; font-weight:500; cursor:pointer; transition:all 0.18s; }
.sign-in-btn:hover { background:#222; transform:translateY(-1px); }
.btn-icon { width:18px; height:18px; border-radius:3px; display:flex; align-items:center; justify-content:center; font-size:12px; flex-shrink:0; }
.g-icon { background:#fff; color:#000; }
.ms-icon { background:#00a4ef; color:#fff; }
.sign-out-btn { width:100%; padding:7px; background:none; border:1px solid var(--border2); border-radius:8px; color:var(--muted2); font-family:'DM Sans',sans-serif; font-size:11px; cursor:pointer; transition:all 0.18s; }
.sign-out-btn:hover { border-color:#ff5555; color:#ff5555; }
.guest-note { font-size:10px; color:var(--muted2); text-align:center; padding:4px 0 2px; line-height:1.4; }

/* MAIN */
#main { flex:1; display:flex; flex-direction:column; overflow:hidden; min-width:0; }
header { display:flex; align-items:center; gap:12px; padding:13px 18px; border-bottom:1px solid var(--border); background:var(--surface); flex-shrink:0; }
#hamburgerBtn { display:none; background:none; border:none; color:var(--white); cursor:pointer; padding:4px; border-radius:6px; }
.av-wrap { position:relative; width:38px; height:38px; flex-shrink:0; }
.av-ring { position:absolute; inset:-3px; border-radius:50%; border:2px solid var(--green); animation:spin-ring 4s linear infinite; border-right-color:transparent; border-bottom-color:transparent; }
@keyframes spin-ring { to { transform:rotate(360deg); } }
.avatar { width:38px; height:38px; border-radius:50%; background:linear-gradient(135deg,#1e3a00,#3a6e00); display:flex; align-items:center; justify-content:center; font-size:18px; }
.hinfo h1 { font-family:'Syne',sans-serif; font-size:14px; font-weight:800; letter-spacing:-0.2px; }
.hinfo .status { font-size:11px; color:var(--green); display:flex; align-items:center; gap:5px; }
.status-dot { width:5px; height:5px; border-radius:50%; background:var(--green); animation:blink 2s ease infinite; }
@keyframes blink { 0%,100%{opacity:1;} 50%{opacity:0.3;} }
.mood-tag { margin-left:auto; font-family:'Syne',sans-serif; font-size:10px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; color:var(--green); border:1px solid var(--green-dim); background:rgba(184,240,74,0.06); padding:4px 10px; border-radius:6px; }

/* MESSAGES */
#messages { flex:1; overflow-y:auto; padding:24px 20px 16px; display:flex; flex-direction:column; gap:14px; scroll-behavior:smooth; }
#messages::-webkit-scrollbar { width:3px; }
#messages::-webkit-scrollbar-thumb { background:var(--border2); border-radius:3px; }
.msg { display:flex; gap:9px; max-width:78%; animation:pop 0.25s cubic-bezier(0.34,1.56,0.64,1) both; }
@keyframes pop { from{opacity:0;transform:scale(0.9) translateY(8px);} to{opacity:1;transform:scale(1) translateY(0);} }
.msg.user { align-self:flex-end; flex-direction:row-reverse; }
.msg.ai { align-self:flex-start; }
.msg-av { width:26px; height:26px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:12px; margin-top:3px; }
.msg.ai .msg-av { background:linear-gradient(135deg,#1e3a00,#3a6e00); }
.msg.user .msg-av { background:#1e1e1e; border:1px solid var(--border2); font-size:11px; }
.bubble { padding:10px 14px; border-radius:18px; font-size:14px; line-height:1.55; }
.msg.ai .bubble { background:var(--card); border:1px solid var(--border); border-bottom-left-radius:4px; }
.msg.user .bubble { background:var(--user-bubble); border:1px solid var(--green-dim); border-bottom-right-radius:4px; }
.cursor { display:inline-block; width:2px; height:14px; background:var(--green); margin-left:2px; vertical-align:middle; border-radius:1px; animation:cur 0.6s step-end infinite; }
@keyframes cur { 0%,100%{opacity:1;} 50%{opacity:0;} }

/* MARKDOWN */
.bubble h2 { font-family:'Syne',sans-serif; font-size:15px; font-weight:800; color:var(--green); margin:10px 0 6px; padding:8px 12px; background:rgba(184,240,74,0.06); border:1px solid var(--green-dim); border-radius:8px; }
.bubble h3 { font-size:13px; font-weight:700; margin:8px 0 4px; }
.bubble strong { font-weight:700; color:var(--white); }
.bubble em { font-style:italic; color:#ccc; }
.bubble ul, .bubble ol { padding-left:18px; margin:6px 0; }
.bubble li { margin:3px 0; font-size:13.5px; }
.bubble code { background:#0d0d0d; border:1px solid var(--border2); padding:2px 6px; border-radius:5px; font-family:monospace; font-size:12px; color:var(--green); }
.bubble pre { background:#0d0d0d; border:1px solid var(--border2); border-radius:8px; padding:10px 12px; margin:8px 0; overflow-x:auto; }
.bubble pre code { background:none; border:none; padding:0; color:#ccc; }
.bubble p { margin:4px 0; }
.bubble p:first-child { margin-top:0; }
.bubble p:last-child { margin-bottom:0; }
.bubble hr { border:none; border-top:1px solid var(--border2); margin:8px 0; }

/* THINKING BAR */
#thinking-bar { display:none; align-items:center; gap:10px; padding:7px 20px; font-size:12px; color:var(--muted2); flex-shrink:0; border-top:1px solid var(--border); background:var(--surface); }
#thinking-bar.show { display:flex; }
.think-dots { display:flex; gap:4px; }
.think-dots span { width:5px; height:5px; border-radius:50%; background:var(--green); animation:td 1s ease infinite; }
.think-dots span:nth-child(2) { animation-delay:.15s; }
.think-dots span:nth-child(3) { animation-delay:.3s; }
@keyframes td { 0%,80%,100%{transform:scale(0.6);opacity:0.4;} 40%{transform:scale(1);opacity:1;} }
.search-pill { display:inline-flex; align-items:center; gap:5px; background:rgba(184,240,74,0.08); border:1px solid var(--green-dim); color:var(--green); font-size:11px; padding:3px 9px; border-radius:20px; font-weight:500; }
.search-pill svg { animation:spin-ring 1s linear infinite; flex-shrink:0; }

/* CHIPS */
.chips { display:flex; gap:7px; flex-wrap:wrap; padding:0 20px 10px; flex-shrink:0; }
.chip { background:var(--card); border:1px solid var(--border2); color:#ccc; font-size:12px; padding:6px 13px; border-radius:20px; cursor:pointer; font-family:'DM Sans',sans-serif; transition:all 0.18s; white-space:nowrap; }
.chip:hover { border-color:var(--green); color:var(--green); background:var(--green-glow); transform:translateY(-1px); }

/* FORMAT TOOLBAR */
.fmt-toolbar { display:flex; gap:4px; padding:0 4px 6px; }
.fmt-btn { background:none; border:1px solid var(--border2); color:var(--muted2); width:28px; height:28px; border-radius:6px; cursor:pointer; font-size:12px; font-family:'DM Sans',sans-serif; display:flex; align-items:center; justify-content:center; transition:all 0.15s; font-weight:600; }
.fmt-btn:hover { border-color:var(--green); color:var(--green); background:var(--green-glow); }

/* INPUT */
.input-area { padding:10px 16px 14px; border-top:1px solid var(--border); background:var(--surface); flex-shrink:0; }
.input-row { display:flex; gap:8px; align-items:flex-end; background:var(--card); border:1px solid var(--border2); border-radius:26px; padding:7px 7px 7px 16px; transition:border-color 0.2s,box-shadow 0.2s; }
.input-row:focus-within { border-color:var(--green); box-shadow:0 0 0 3px rgba(184,240,74,0.07); }
#input { flex:1; background:transparent; border:none; outline:none; color:var(--white); font-family:'DM Sans',sans-serif; font-size:14px; resize:none; max-height:90px; line-height:1.5; padding:3px 0; }
#input::placeholder { color:var(--muted2); }
#sendBtn { width:34px; height:34px; border-radius:50%; background:var(--green); border:none; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:transform 0.15s,box-shadow 0.15s; }
#sendBtn:hover { transform:scale(1.1); box-shadow:0 0 12px rgba(184,240,74,0.4); }
#sendBtn:active { transform:scale(0.93); }
#sendBtn:disabled { background:var(--border2); cursor:not-allowed; box-shadow:none; transform:none; }

/* WELCOME */
.welcome { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; height:100%; text-align:center; padding:20px; pointer-events:none; animation:fadeIn 0.5s ease both; }
@keyframes fadeIn { from{opacity:0;transform:translateY(6px);} to{opacity:1;transform:translateY(0);} }
.welcome-ball { font-size:50px; line-height:1; margin-bottom:10px; filter:drop-shadow(0 0 20px rgba(184,240,74,0.3)); animation:float 3s ease-in-out infinite; }
@keyframes float { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-8px);} }
.welcome h2 { font-family:'Syne',sans-serif; font-size:22px; font-weight:800; background:linear-gradient(135deg,var(--white),var(--green)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
.welcome p { font-size:13px; color:var(--muted2); }

/* OVERLAY */
#overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:9; }

/* MOBILE */
@media (max-width:680px) {
  #sidebar { position:fixed; top:0; left:0; bottom:0; transform:translateX(-100%); z-index:20; }
  #sidebar.open { transform:translateX(0); }
  #overlay.show { display:block; }
  #hamburgerBtn { display:flex; }
  #messages { padding:16px 14px 12px; }
  .chips { padding:0 14px 8px; }
  .input-area { padding:8px 12px 12px; }
}
</style>
</head>
<body>

<div id="sidebar">
  <div class="sb-top">
    <div class="sb-logo">
      <div class="sb-logo-ball">&#x26BD;</div>
      <span>Your AI</span>
    </div>
    <button id="newChatBtn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      New chat
    </button>
  </div>
  <div class="sb-search">
    <svg class="sb-search-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input type="text" id="chat-search" placeholder="Search chats..."/>
  </div>
  <div class="sb-chats" id="chat-list"></div>
  <div class="sb-bottom" id="sb-bottom"></div>
</div>

<div id="overlay"></div>

<div id="main">
  <header>
    <button id="hamburgerBtn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    <div class="av-wrap">
      <div class="av-ring"></div>
      <div class="avatar">&#x26BD;</div>
    </div>
    <div class="hinfo">
      <h1 id="chat-title">Your AI</h1>
      <div class="status"><div class="status-dot"></div> online</div>
    </div>
    <div class="mood-tag">Chill &#10022;</div>
  </header>

  <div id="messages">
    <div class="welcome" id="welcome">
      <div class="welcome-ball">&#x26BD;</div>
      <h2>What's good?</h2>
      <p>Talk footy, life, whatever.</p>
    </div>
  </div>

  <div id="thinking-bar">
    <div class="think-dots"><span></span><span></span><span></span></div>
    <div id="think-text" style="font-style:italic">thinking...</div>
  </div>

  <div class="chips" id="chips">
    <button class="chip" data-msg="Who's winning the Premier League this season?">&#x1F3C6; Prem title race?</button>
    <button class="chip" data-msg="Messi or Ronaldo - who's the GOAT?">&#x1F410; Messi or Ronaldo?</button>
    <button class="chip" data-msg="What's the best goal ever scored?">&#x26A1; Best goal ever?</button>
    <button class="chip" data-msg="just vibing, what's up?">Just vibe</button>
  </div>

  <div class="input-area">
    <div class="fmt-toolbar" id="fmt-toolbar">
      <button class="fmt-btn" data-before="**" data-after="**" title="Bold"><b>B</b></button>
      <button class="fmt-btn" data-before="*" data-after="*" title="Italic"><i>I</i></button>
      <button class="fmt-btn" data-before="__" data-after="__" title="Underline"><u>U</u></button>
      <button class="fmt-btn" data-before="`" data-after="`" title="Code" style="font-family:monospace;font-size:11px">&lt;/&gt;</button>
    </div>
    <div class="input-row">
      <textarea id="input" rows="1" placeholder="say something..."></textarea>
      <button id="sendBtn">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      </button>
    </div>
  </div>
</div>

<script>
var STORAGE_KEY = 'myai_chats_v2';
var USER_KEY = 'myai_user_v1';
var TTL_MS = 48 * 60 * 60 * 1000;

var currentChatId = null;
var history = [];
var isThinking = false;
var user = loadUser();
var allChats = loadChats();

var thinkPhrases = ['thinking...','on it...','give me a sec...','cooking...','lemme think...','searching...','checking that...','looking it up...'];

function getSystemPrompt() {
  return 'You are a chill, laid-back AI homie who loves football (soccer). You have access to web search.\n\nPersonality:\n- Casual always, like texting a mate. Never formal.\n- Real opinions, no fence-sitting.\n- Funny but effortless, never try-hard.\n- Use footy slang naturally (worldie, tekkers, top bins, banger, etc.)\n- Football is your zone but can chat about anything.\n- Never say you are an AI unless asked directly.\n- Occasionally end with a follow-up like "want me to look up the stats?" or "should i dig deeper?" to keep things engaging.\n\nFormatting - use markdown:\n- **bold** for names, clubs, key facts\n- *italic* for opinions\n- bullet points for lists\n- For match info use: ## Match Title then Team A vs Team B, score, date, competition, then highlights as bullets\n- Short for casual chat, detailed for football questions.\n\nToday is ' + new Date().toDateString() + '.\nSearch the web for scores, news, transfers, standings, anything needing fresh info.';
}

function loadChats() {
  try {
    var raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return [];
    var chats = JSON.parse(raw);
    if (!user || user.type === 'guest') {
      var cutoff = Date.now() - TTL_MS;
      return chats.filter(function(c) { return c.updatedAt > cutoff; });
    }
    return chats;
  } catch(e) { return []; }
}

function saveChats() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(allChats)); } catch(e) {}
}

function loadUser() {
  try {
    var raw = localStorage.getItem(USER_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch(e) { return null; }
}

function saveUser(u) {
  user = u;
  try { localStorage.setItem(USER_KEY, JSON.stringify(u)); } catch(e) {}
}

function newChat() {
  if (currentChatId && history.length > 0) saveCurrentChat();
  currentChatId = 'chat_' + Date.now();
  history = [];
  var messagesEl = document.getElementById('messages');
  messagesEl.innerHTML = '<div class="welcome" id="welcome"><div class="welcome-ball">&#x26BD;</div><h2>What\'s good?</h2><p>Talk footy, life, whatever.</p></div>';
  document.getElementById('chips').style.display = 'flex';
  document.getElementById('chat-title').textContent = 'Your AI';
  renderChatList();
  closeSidebar();
  document.getElementById('input').focus();
}

function saveCurrentChat() {
  if (!currentChatId || history.length === 0) return;
  var firstUserMsg = null;
  for (var i = 0; i < history.length; i++) {
    if (history[i].role === 'user') { firstUserMsg = history[i]; break; }
  }
  var title = firstUserMsg ? firstUserMsg.content.slice(0, 38) + (firstUserMsg.content.length > 38 ? '...' : '') : 'New chat';
  var existing = -1;
  for (var j = 0; j < allChats.length; j++) {
    if (allChats[j].id === currentChatId) { existing = j; break; }
  }
  var chatObj = { id: currentChatId, title: title, history: history.slice(), updatedAt: Date.now(), userId: user ? user.id : 'guest' };
  if (existing >= 0) allChats[existing] = chatObj;
  else allChats.unshift(chatObj);
  saveChats();
  renderChatList();
  var shortTitle = title.slice(0, 24) + (title.length > 24 ? '...' : '');
  document.getElementById('chat-title').textContent = shortTitle;
}

function loadChat(chatId) {
  if (currentChatId && history.length > 0) saveCurrentChat();
  var chat = null;
  for (var i = 0; i < allChats.length; i++) {
    if (allChats[i].id === chatId) { chat = allChats[i]; break; }
  }
  if (!chat) return;
  currentChatId = chat.id;
  history = chat.history.slice();
  var messagesEl = document.getElementById('messages');
  messagesEl.innerHTML = '';
  document.getElementById('chips').style.display = 'none';
  document.getElementById('chat-title').textContent = chat.title.slice(0,24) + (chat.title.length > 24 ? '...' : '');
  for (var j = 0; j < history.length; j++) {
    var role = history[j].role === 'user' ? 'user' : 'ai';
    appendBubble(role, history[j].content);
  }
  messagesEl.scrollTop = messagesEl.scrollHeight;
  renderChatList();
  closeSidebar();
}

function deleteChat(chatId, e) {
  e.stopPropagation();
  allChats = allChats.filter(function(c) { return c.id !== chatId; });
  saveChats();
  if (currentChatId === chatId) newChat();
  else renderChatList();
}

function filterChats(query) {
  renderChatList(query.toLowerCase().trim());
}

function timeAgo(ts) {
  var diff = Date.now() - ts;
  var m = Math.floor(diff / 60000);
  if (m < 1) return 'just now';
  if (m < 60) return m + 'm ago';
  var h = Math.floor(m / 60);
  if (h < 24) return h + 'h ago';
  return Math.floor(h/24) + 'd ago';
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/[<]/g,'&lt;').replace(/[>]/g,'&gt;').replace(/"/g,'&quot;');
}

function renderChatList(query) {
  query = query || '';
  var el = document.getElementById('chat-list');
  var visibleChats = allChats.filter(function(c) {
    var matchesQuery = !query || c.title.toLowerCase().indexOf(query) !== -1;
    return matchesQuery;
  });
  if (visibleChats.length === 0) {
    el.innerHTML = '<div class="no-chats">' + (query ? 'No chats found' : 'No chats yet') + '</div>';
    return;
  }
  var now = Date.now();
  var todayCutoff = now - 24*60*60*1000;
  var today = visibleChats.filter(function(c) { return c.updatedAt > todayCutoff; });
  var earlier = visibleChats.filter(function(c) { return c.updatedAt <= todayCutoff; });
  var html = '';
  if (today.length) {
    html += '<div class="sb-section-label">Today</div>';
    today.forEach(function(c) { html += chatItemHTML(c); });
  }
  if (earlier.length) {
    html += '<div class="sb-section-label">Earlier</div>';
    earlier.forEach(function(c) { html += chatItemHTML(c); });
  }
  el.innerHTML = html;
  el.querySelectorAll('.chat-item').forEach(function(item) {
    item.addEventListener('click', function() { loadChat(item.dataset.id); });
    var delBtn = item.querySelector('.chat-item-del');
    if (delBtn) delBtn.addEventListener('click', function(e) { deleteChat(item.dataset.id, e); });
  });
}

function chatItemHTML(c) {
  var active = c.id === currentChatId ? 'active' : '';
  return '<div class="chat-item ' + active + '" data-id="' + escHtml(c.id) + '">' +
    '<div class="chat-item-icon">&#x1F4AC;</div>' +
    '<div class="chat-item-info">' +
    '<div class="chat-item-title">' + escHtml(c.title) + '</div>' +
    '<div class="chat-item-time">' + timeAgo(c.updatedAt) + '</div>' +
    '</div>' +
    '<button class="chat-item-del" title="Delete">' +
    '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>' +
    '</button></div>';
}

function renderAccount() {
  var el = document.getElementById('sb-bottom');
  if (user && user.type !== 'guest') {
    var initials = user.name.split(' ').map(function(w) { return w[0]; }).join('').slice(0,2).toUpperCase();
    el.innerHTML = '<div class="account-info"><div class="account-av ' + user.type + '">' + initials + '</div><div class="account-text"><div class="account-name">' + escHtml(user.name) + '</div><div class="account-sub">via ' + (user.type === 'google' ? 'Google' : 'Microsoft') + '</div></div></div><button class="sign-out-btn" id="signOutBtn">Sign out</button>';
    document.getElementById('signOutBtn').addEventListener('click', signOut);
  } else {
    el.innerHTML = '<div class="sign-in-btns"><button class="sign-in-btn" id="googleBtn"><div class="btn-icon g-icon">G</div>Continue with Google</button><button class="sign-in-btn" id="msBtn"><div class="btn-icon ms-icon">&#x229E;</div>Continue with Microsoft</button></div><div class="guest-note" style="margin-top:8px">Chats auto-delete after 48h as guest</div>';
    document.getElementById('googleBtn').addEventListener('click', function() { signIn('google'); });
    document.getElementById('msBtn').addEventListener('click', function() { signIn('microsoft'); });
  }
}

function signIn(provider) {
  var names = { google: 'You (Google)', microsoft: 'You (Microsoft)' };
  var mockUser = { id: provider + '_user_1', name: names[provider], type: provider };
  saveUser(mockUser);
  allChats.forEach(function(c) { if (c.userId === 'guest') c.userId = mockUser.id; });
  saveChats();
  renderAccount();
  renderChatList();
  showToast('Signed in with ' + (provider === 'google' ? 'Google' : 'Microsoft') + ' ✓');
}

function signOut() {
  saveUser(null);
  user = null;
  renderAccount();
  renderChatList();
  showToast('Signed out');
}

function showToast(msg) {
  var t = document.getElementById('toast');
  if (!t) {
    t = document.createElement('div');
    t.id = 'toast';
    t.style.cssText = 'position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(10px);background:#222;border:1px solid #2a2a2a;color:#efefef;font-size:12px;padding:8px 16px;border-radius:20px;z-index:999;opacity:0;transition:all 0.3s;pointer-events:none;white-space:nowrap;';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.style.opacity = '1';
  t.style.transform = 'translateX(-50%) translateY(0)';
  setTimeout(function() { t.style.opacity = '0'; t.style.transform = 'translateX(-50%) translateY(10px)'; }, 2200);
}

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('overlay').classList.toggle('show');
}

function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('overlay').classList.remove('show');
}

function renderMarkdown(text) {
  if (typeof marked !== 'undefined') {
    return marked.parse(text, { breaks: true, gfm: true });
  }
  return escHtml(text);
}

function appendBubble(role, text) {
  var messagesEl = document.getElementById('messages');
  var div = document.createElement('div');
  div.className = 'msg ' + role;
  var av = document.createElement('div');
  av.className = 'msg-av';
  av.textContent = role === 'ai' ? '\u26BD' : (user && user.type !== 'guest' ? user.name[0].toUpperCase() : '\uD83D\uDE0E');
  var bubble = document.createElement('div');
  bubble.className = 'bubble';
  if (role === 'ai') {
    bubble.innerHTML = renderMarkdown(text);
  } else {
    bubble.textContent = text;
  }
  div.appendChild(av);
  div.appendChild(bubble);
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function addMessage(role, text) {
  var w = document.getElementById('welcome');
  if (w) w.style.display = 'none';
  appendBubble(role, text);
}

function typeMessage(text) {
  var w = document.getElementById('welcome');
  if (w) w.style.display = 'none';
  var messagesEl = document.getElementById('messages');
  var div = document.createElement('div');
  div.className = 'msg ai';
  var av = document.createElement('div');
  av.className = 'msg-av';
  av.textContent = '\u26BD';
  var bubble = document.createElement('div');
  bubble.className = 'bubble';
  var textNode = document.createTextNode('');
  var cursor = document.createElement('span');
  cursor.className = 'cursor';
  bubble.appendChild(textNode);
  bubble.appendChild(cursor);
  div.appendChild(av);
  div.appendChild(bubble);
  messagesEl.appendChild(div);

  var i = 0;
  var speed = Math.max(12, Math.min(35, 1800 / text.length));
  return new Promise(function(resolve) {
    function type() {
      if (i < text.length) {
        textNode.textContent += text[i];
        i++;
        messagesEl.scrollTop = messagesEl.scrollHeight;
        setTimeout(type, speed);
      } else {
        cursor.remove();
        bubble.innerHTML = renderMarkdown(text);
        messagesEl.scrollTop = messagesEl.scrollHeight;
        resolve();
      }
    }
    type();
  });
}

function setThinking(label, searching) {
  var thinkText = document.getElementById('think-text');
  if (searching) {
    thinkText.innerHTML = '<span class="search-pill"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>' + escHtml(label) + '</span>';
  } else {
    thinkText.innerHTML = '<span style="font-style:italic">' + escHtml(label) + '</span>';
  }
}

function fmtWrap(before, after) {
  var el = document.getElementById('input');
  var start = el.selectionStart;
  var end = el.selectionEnd;
  var selected = el.value.slice(start, end) || 'text';
  el.value = el.value.slice(0, start) + before + selected + after + el.value.slice(end);
  el.focus();
  el.selectionStart = start + before.length;
  el.selectionEnd = start + before.length + selected.length;
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 90) + 'px';
}

async function sendMessage() {
  var inputEl = document.getElementById('input');
  var sendBtn = document.getElementById('sendBtn');
  var thinkingBar = document.getElementById('thinking-bar');
  var text = inputEl.value.trim();
  if (!text || isThinking) return;
  if (!currentChatId) currentChatId = 'chat_' + Date.now();

  inputEl.value = '';
  inputEl.style.height = 'auto';
  isThinking = true;
  sendBtn.disabled = true;
  document.getElementById('chips').style.display = 'none';

  addMessage('user', text);
  history.push({ role: 'user', content: text });

  setThinking(thinkPhrases[Math.floor(Math.random() * 5)]);
  thinkingBar.classList.add('show');

  try {
    var msgs = history.slice();
    var finalReply = null;

    while (!finalReply) {
      var res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          model: 'claude-sonnet-4-20250514',
          max_tokens: 1500,
          system: getSystemPrompt(),
          tools: [{ type: 'web_search_20250305', name: 'web_search' }],
          messages: msgs
        })
      });

      var data = await res.json();

      if (data.stop_reason === 'tool_use') {
        var toolUse = null;
        for (var i = 0; i < data.content.length; i++) {
          if (data.content[i].type === 'tool_use') { toolUse = data.content[i]; break; }
        }
        if (toolUse) setThinking('searching "' + (toolUse.input && toolUse.input.query ? toolUse.input.query : '...') + '"', true);
        msgs.push({ role: 'assistant', content: data.content });
        var serverToolResults = data.content.filter(function(b) { return b.type === 'tool_result'; });
        if (serverToolResults.length) {
          msgs.push({ role: 'user', content: serverToolResults });
        } else {
          var fallback = data.content.filter(function(b) { return b.type === 'tool_use'; }).map(function(b) {
            return { type: 'tool_result', tool_use_id: b.id, content: 'Search completed.' };
          });
          msgs.push({ role: 'user', content: fallback });
        }
        setThinking('cooking...');
      } else {
        var textBlock = null;
        if (data.content) {
          for (var k = 0; k < data.content.length; k++) {
            if (data.content[k].type === 'text') { textBlock = data.content[k]; break; }
          }
        }
        finalReply = textBlock ? textBlock.text : 'yo brain glitched \uD83D\uDE05';
      }
    }

    thinkingBar.classList.remove('show');
    history.push({ role: 'assistant', content: finalReply });
    await typeMessage(finalReply);
    saveCurrentChat();

  } catch(err) {
    console.error(err);
    thinkingBar.classList.remove('show');
    await typeMessage('lost connection for a sec, try again?');
    history.pop();
  }

  isThinking = false;
  sendBtn.disabled = false;
  document.getElementById('input').focus();
}

// INIT
document.addEventListener('DOMContentLoaded', function() {
  // Prune expired guest chats
  if (!user || user.type === 'guest') {
    var cutoff = Date.now() - TTL_MS;
    allChats = allChats.filter(function(c) { return c.updatedAt > cutoff; });
    saveChats();
  }

  currentChatId = 'chat_' + Date.now();
  renderChatList();
  renderAccount();

  // New chat
  document.getElementById('newChatBtn').addEventListener('click', newChat);

  // Sidebar toggle
  document.getElementById('hamburgerBtn').addEventListener('click', toggleSidebar);
  document.getElementById('overlay').addEventListener('click', closeSidebar);

  // Send
  document.getElementById('sendBtn').addEventListener('click', sendMessage);

  // Input
  var inputEl = document.getElementById('input');
  inputEl.addEventListener('input', function() {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 90) + 'px';
  });
  inputEl.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });

  // Chat search
  document.getElementById('chat-search').addEventListener('input', function(e) {
    filterChats(e.target.value);
  });

  // Chips
  document.getElementById('chips').addEventListener('click', function(e) {
    var chip = e.target.closest('.chip');
    if (chip) {
      document.getElementById('input').value = chip.dataset.msg || chip.textContent.trim();
      sendMessage();
      document.getElementById('chips').style.display = 'none';
    }
  });

  // Format toolbar
  document.getElementById('fmt-toolbar').addEventListener('click', function(e) {
    var btn = e.target.closest('.fmt-btn');
    if (btn) fmtWrap(btn.dataset.before, btn.dataset.after);
  });
});
</script>
